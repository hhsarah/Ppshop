<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PILPOIL — Maison de campagne</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Caveat:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --paper:#F5EFE2;
  --linen:#EBE2CC;
  --wood:#D9C29B;
  --honey:#D9A441;
  --moss:#3F4E2A;
  --moss-2:#5A6E3B;
  --ink:#241B10;
  --terra:#A8542C;
  --line:rgba(36,27,16,.14);
  --shadow:0 1px 3px rgba(36,27,16,.06),0 16px 40px rgba(36,27,16,.08);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:var(--paper);color:var(--ink);
  background-image:
    radial-gradient(circle at 20% 10%,rgba(217,164,65,.08) 0%,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(63,78,42,.06) 0%,transparent 40%);
  -webkit-font-smoothing:antialiased;line-height:1.55}
.display{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-.01em;line-height:1.02}
.hand{font-family:'Caveat',cursive;font-weight:500;color:var(--terra)}
img{display:block;max-width:100%}
.container{max-width:1240px;margin:0 auto;padding:0 28px}
button{font-family:inherit;cursor:pointer}

/* Announce */
.announce{background:var(--moss);color:var(--paper);font-size:13px;text-align:center;padding:10px 16px;letter-spacing:.04em}
.announce .hand{color:var(--wood)}

/* Nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(245,239,226,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:12px;font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:.04em;color:var(--ink)}
.brand-mark{width:36px;height:36px;border-radius:50%;background:var(--moss);color:var(--paper);display:grid;place-items:center;font-size:14px}
.nav-links{display:flex;gap:30px}
.nav-links a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;opacity:.78}
.nav-links a:hover{opacity:1;color:var(--moss)}
.nav-actions{display:flex;align-items:center;gap:12px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--ink)}
.cart-pill{display:flex;align-items:center;gap:8px;background:var(--moss);color:var(--paper);border:0;border-radius:99px;padding:11px 18px 11px 14px;font-size:14px;font-weight:600}
.cart-pill .badge{background:var(--honey);color:var(--ink);font-size:11px;font-weight:700;border-radius:99px;padding:2px 7px;line-height:1}

/* Hero */
.hero{padding:48px 0 96px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr}}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--linen);color:var(--moss);
  border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;border:1px dashed rgba(63,78,42,.3)}
.hero h1{font-family:'Fraunces',serif;font-size:clamp(56px,8vw,116px);line-height:.94;margin:20px 0 18px;font-weight:500}
.hero h1 .underline{position:relative;display:inline-block}
.hero h1 .underline svg{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:14px;color:var(--honey)}
.hero h1 em{font-style:italic;color:var(--moss);font-family:'Fraunces',serif}
.hero p.sub{font-size:18px;color:rgba(36,27,16,.75);max-width:48ch;margin:0 0 28px}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;font-weight:600;font-size:15px;padding:16px 26px;border-radius:99px;transition:transform .18s ease}
.btn-primary{background:var(--moss);color:var(--paper)}
.btn-primary:hover{background:var(--moss-2);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:14.5px 24px}
.btn-ghost:hover{background:var(--ink);color:var(--paper)}

.hero-stars{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13.5px;color:var(--ink)}
.stars{display:flex;color:var(--honey);gap:1px}
.hero-visual{position:relative;aspect-ratio:5/6;border-radius:24px;overflow:hidden;background:var(--linen);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-ph{position:absolute;inset:0;background:
  repeating-linear-gradient(43deg,rgba(217,164,65,.12) 0 22px,rgba(217,194,155,.18) 22px 23px),
  linear-gradient(160deg,var(--wood),var(--linen));display:grid;place-items:end center;padding:32px}
.hero-ph-tag{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:rgba(245,239,226,.7);padding:8px 14px;border-radius:99px}
.note{position:absolute;background:var(--paper);padding:14px 18px;border-radius:14px;
  border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;line-height:1.4;max-width:240px}
.note .hand{font-size:18px;display:block;margin-bottom:2px}
.n1{top:14%;left:-22px;transform:rotate(-3deg)}
.n2{bottom:7%;right:-18px;transform:rotate(2deg)}
.scribble{position:absolute;width:60px;height:60px;color:var(--terra);opacity:.7}
.sc1{top:6%;right:14%;transform:rotate(20deg)}
.sc2{bottom:18%;left:6%;transform:rotate(-10deg)}

.trust-row{margin-top:48px;padding-top:28px;border-top:1px dashed var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:760px){.trust-row{grid-template-columns:repeat(2,1fr)}}
.trust-item{display:flex;gap:12px;align-items:center;color:var(--ink);font-size:14px}
.trust-item b{display:block;font-weight:600}
.trust-item small{display:block;color:rgba(36,27,16,.6);font-size:12px}
.trust-item .b{width:42px;height:42px;border-radius:12px;background:var(--linen);display:grid;place-items:center;color:var(--moss);flex:none}

/* Section */
.section{padding:96px 0;position:relative}
.section-head{max-width:680px;margin:0 auto 56px;text-align:center}
.section-head h2{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(40px,5vw,72px);line-height:1;margin:12px 0 12px}
.section-head p{font-size:17px;color:rgba(36,27,16,.75)}
.eyebrow{text-transform:uppercase;font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--moss)}

/* Steps */
.steps-wrap{background:var(--linen);padding:96px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.steps-wrap::before,.steps-wrap::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;filter:blur(80px)}
.steps-wrap::before{background:rgba(217,164,65,.15);top:-50px;right:-50px}
.steps-wrap::after{background:rgba(63,78,42,.12);bottom:-50px;left:-50px}
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;position:relative}
@media(max-width:880px){.steps-grid{grid-template-columns:1fr}}
.step{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:32px;position:relative;transition:transform .25s ease}
.step:hover{transform:translateY(-4px) rotate(-.5deg)}
.step-num{font-family:'Fraunces',serif;font-style:italic;font-size:96px;color:var(--honey);line-height:.8;margin-bottom:6px}
.step h3{font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin:0 0 8px}
.step p{margin:0;color:rgba(36,27,16,.75);font-size:15px}
.step .ico-art{width:74px;height:74px;border-radius:18px;background:var(--linen);display:grid;place-items:center;color:var(--moss);margin-bottom:18px;border:1px solid var(--line)}

/* Benefits */
.bens-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:880px){.bens-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.bens-grid{grid-template-columns:1fr}}
.ben{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px;min-height:200px}
.ben.dark{background:var(--moss);color:var(--paper);border-color:transparent}
.ben.honey{background:var(--honey);color:var(--ink)}
.ben.wood{background:var(--wood);color:var(--ink)}
.ben .ico{width:46px;height:46px;border-radius:14px;background:var(--linen);display:grid;place-items:center;color:var(--moss)}
.ben.dark .ico{background:rgba(245,239,226,.15);color:var(--paper)}
.ben.honey .ico,.ben.wood .ico{background:rgba(36,27,16,.1);color:var(--ink)}
.ben h4{margin:auto 0 0;font-family:'Fraunces',serif;font-weight:600;font-size:19px;line-height:1.2}

/* Product */
.product{background:var(--paper)}
.p-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:start}
@media(max-width:980px){.p-grid{grid-template-columns:1fr}}
.p-main{aspect-ratio:1;border-radius:32px;background:linear-gradient(165deg,var(--wood) 0%,var(--linen) 100%);position:relative;overflow:hidden;border:1px solid var(--line)}
.p-main .obj{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:42%;aspect-ratio:1/2.1;
  background:linear-gradient(170deg,#3A2E1F 0%,#241B10 70%);border-radius:50% 50% 38% 38% / 60% 60% 40% 40%;
  box-shadow:inset 0 -10px 24px rgba(255,255,255,.05),0 30px 60px rgba(36,27,16,.25)}
.p-main .obj::before{content:"";position:absolute;top:8%;left:50%;transform:translateX(-50%);width:36%;height:5%;border-radius:50%;background:rgba(217,164,65,.55);filter:blur(4px)}
.p-main .tag-pos{position:absolute;top:18px;left:18px}
.p-thumbs{display:flex;gap:10px;margin-top:14px}
.p-thumb{flex:1;aspect-ratio:1;border-radius:16px;background:var(--linen);border:2px solid transparent}
.p-thumb.active{border-color:var(--ink)}
.p-thumb.t2{background:linear-gradient(135deg,var(--wood),var(--linen))}
.p-thumb.t3{background:linear-gradient(135deg,var(--moss-2),var(--moss))}
.p-thumb.t4{background:linear-gradient(135deg,#E8D9B8,var(--wood))}
.p-info h2{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(40px,4.8vw,72px);margin:8px 0 4px;line-height:1}
.p-meta{display:flex;align-items:center;gap:10px;color:rgba(36,27,16,.65);font-size:14px;margin:10px 0 18px}
.price{font-family:'Fraunces',serif;font-size:42px;font-weight:600;line-height:1}
.price-old{color:rgba(36,27,16,.5);text-decoration:line-through;font-size:18px;margin-left:10px}
.price-save{background:var(--moss);color:var(--paper);font-size:11px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:99px;margin-left:10px;text-transform:uppercase}
.qty{display:inline-flex;align-items:center;background:var(--linen);border-radius:99px;padding:6px;margin-top:6px}
.qty button{width:36px;height:36px;border:0;background:transparent;border-radius:50%;font-size:18px;font-weight:600;color:var(--ink)}
.qty button:hover{background:var(--paper)}
.qty .n{min-width:32px;text-align:center;font-weight:600}
.add-row{display:flex;gap:10px;margin-top:24px}
.add-row .btn-primary{flex:1;padding:18px 22px;font-size:16px;justify-content:center}
.assurance{margin-top:28px;padding-top:24px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:12px}
.assurance li{list-style:none;display:flex;gap:12px;align-items:center;font-size:14px;color:rgba(36,27,16,.8)}
.assurance svg{color:var(--moss);flex:none}
.swatches{display:flex;gap:10px;margin-top:10px}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:transparent;cursor:pointer}
.sw.active{border-color:var(--ink)}
.sw.sage{background:linear-gradient(135deg,var(--moss-2),var(--moss))}
.sw.honey{background:linear-gradient(135deg,#E8C282,var(--honey))}
.sw.charcoal{background:linear-gradient(135deg,#3A2E1F,#241B10)}

/* Quote / story */
.story{padding:120px 0;text-align:center;background:var(--linen);position:relative;overflow:hidden}
.story::before{content:"“";position:absolute;font-family:'Fraunces',serif;font-size:380px;line-height:.8;color:var(--wood);opacity:.6;top:20px;left:50%;transform:translateX(-50%)}
.story-q{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:clamp(28px,3.6vw,46px);max-width:900px;margin:0 auto;line-height:1.2;position:relative}
.story-att{margin-top:32px;font-size:14px;color:rgba(36,27,16,.7);position:relative;display:inline-flex;align-items:center;gap:12px}
.story-att .av{width:42px;height:42px;border-radius:50%;background:var(--wood);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600}

/* Reviews */
.revs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media(max-width:880px){.revs-grid{grid-template-columns:1fr}}
.rev{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;transition:transform .2s}
.rev:hover{transform:translateY(-3px)}
.rev-img{aspect-ratio:4/3;border-radius:14px;background:var(--linen);position:relative;overflow:hidden}
.rev-img::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(217,194,155,.4) 0 12px,transparent 12px 22px)}
.rev-stars{display:flex;color:var(--honey);gap:1px}
.rev p{margin:0;font-family:'Fraunces',serif;font-style:italic;font-size:17px;line-height:1.45;color:var(--ink)}
.rev-name{display:flex;gap:12px;align-items:center;margin-top:auto;padding-top:14px;border-top:1px dashed var(--line)}
.rev-name .av{width:38px;height:38px;border-radius:50%;background:var(--wood);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600;font-size:14px}
.rev-name b{display:block;font-size:14px;font-weight:600}
.rev-name small{color:rgba(36,27,16,.6);font-size:12.5px}

/* FAQ */
.faq{background:var(--paper);padding:96px 0}
.faq-list{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.faq-item{background:var(--linen);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;font-weight:600;font-family:'Fraunces',serif;font-size:18px}
.faq-q .plus{width:30px;height:30px;border-radius:50%;background:var(--paper);display:grid;place-items:center;transition:transform .25s}
.faq-item.open .plus{transform:rotate(45deg);background:var(--moss);color:var(--paper)}
.faq-a{padding:0 24px;max-height:0;overflow:hidden;transition:max-height .35s ease,padding .25s ease;color:rgba(36,27,16,.78)}
.faq-item.open .faq-a{padding:0 24px 24px;max-height:400px}

/* Footer */
.footer{background:var(--moss);color:var(--paper);padding:72px 0 28px;border-top-left-radius:40px;border-top-right-radius:40px;margin-top:40px}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;margin-bottom:40px}
@media(max-width:840px){.footer-grid{grid-template-columns:1fr 1fr;gap:32px 24px}}
.footer h5{font-family:'DM Sans',sans-serif;text-transform:uppercase;font-size:12px;letter-spacing:.14em;color:var(--wood);margin:0 0 16px;font-weight:600}
.footer a{color:var(--paper);text-decoration:none;display:block;padding:6px 0;font-size:14px;opacity:.85}
.footer a:hover{opacity:1;color:var(--honey)}
.footer .brand{color:var(--paper);font-family:'Fraunces',serif}
.footer .brand-mark{background:var(--honey);color:var(--ink)}
.footer-bar{padding-top:24px;border-top:1px solid rgba(245,239,226,.18);font-size:12.5px;color:rgba(245,239,226,.65);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.foot-social{display:flex;gap:10px;margin-top:18px}
.foot-social a{width:38px;height:38px;border-radius:50%;background:rgba(245,239,226,.1);display:grid;place-items:center;padding:0}
.foot-social a:hover{background:var(--honey)}
.footer-tag{margin-top:14px;color:rgba(245,239,226,.75);max-width:30ch;font-size:14px;line-height:1.55}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  Sparkles:(p)=>(<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 4v4M12 16v4M4 12h4M16 12h4M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg>),
  Home:(p)=>(<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m3 11 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z"/></svg>),
  Recycle:(p)=>(<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M7 7 4 10l3 3M17 17l3-3-3-3M4 10h11M20 14H9"/></svg>),
  Plus:(p)=>(<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 5v14M5 12h14"/></svg>),
  Arrow:(p)=>(<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M5 12h14M13 5l7 7-7 7"/></svg>),
  Check:(p)=>(<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m5 12 5 5 9-11"/></svg>),
  Bag:(p)=>(<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M6 8h12l-1 12H7Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>),
  Search:(p)=>(<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></svg>),
  Insta:(p)=>(<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.6" {...p}><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3.5"/><circle cx="17" cy="7" r=".8" fill="currentColor"/></svg>),
};

function Stars({n=5}){return <span className="stars">{Array.from({length:n}).map((_,i)=><Ic.Star key={i}/>)}</span>}

function App(){
  const [qty,setQty]=useState(1);
  const [color,setColor]=useState("sage");

  const [cart,setCart]=useState(0);
  const [open,setOpen]=useState(0);
  const [toast,setToast]=useState(null);
  const productRef=useRef(null);

  function add(){
    setCart(c=>c+qty);
    setToast(`${qty} brosse${qty>1?"s":""} ajoutée${qty>1?"s":""}`);
    setTimeout(()=>setToast(null),2200);
  }
  function scrollTo(){
    const top=productRef.current.getBoundingClientRect().top+window.scrollY-80;

  }

    {id:"honey",label:"Miel"},
    {id:"charcoal",label:"Bois brûlé"},

    {q:"Livraison ?",a:"Offerte en 2-4 jours en France métropolitaine. Suivi par email à chaque étape."},
    {q:"Nettoyage ?",a:"Le tiroir à poils se vide d'une main. Le réservoir et la brosse se rincent à l'eau tiède."},
  ];

      <span className="hand">~</span> Livraison offerte dès 49€ · Satisfait ou remboursé 30 jours · Garantie 2 ans <span className="hand">~</span>

            <span style={{opacity:.7,fontSize:12}}>en 2 minutes de brossage</span>

              ))}

          <div style={{display:"flex",gap:14,alignItems:"center",marginTop:18}}>

            <div className="qty">
              <button onClick={()=>setQty(Math.max(1,qty-1))}>−</button>
              <span className="n">{qty}</span>
              <button onClick={()=>setQty(qty+1)}>+</button>

          </div>

            <button className="btn btn-primary" onClick={add}>

            <li><Ic.Truck/> Livraison offerte en 2-4 jours ouvrés</li>
            <li><Ic.Shield/> 30 jours pour l'essayer, sinon remboursé</li>
            <li><Ic.Recycle/> Garantie 2 ans, pièces détachées en stock</li>
            <li><Ic.Leaf/> Conçue en Drôme · assemblée au Portugal</li>
          </ul>
        </div>
      </div>
    </section>

    {/* Reviews */}

      <div className="container">
        <div className="section-head">
          <span className="eyebrow">Ils ont essayé</span>
          <h2>De vraies maisons.<br/>De vrais animaux.</h2>
        </div>
        <div className="revs-grid">
          {[
            {n:"Marie L.",p:"avec Tigrou, chat européen",t:"Mon canapé noir était une catastrophe. Maintenant je peux porter du noir sans réfléchir. Ça change tout.",av:"ML"},
            {n:"Julien R.",p:"avec Mochi, golden",t:"Mochi se laisse brosser pendant 20 minutes sans broncher. Pour un chien qui détestait sa brosse, c'est un miracle.",av:"JR"},
            {n:"Camille D.",p:"avec Nuage, maine coon",t:"La vapeur est vraiment tiède. Mon chat très peureux ne s'en méfie pas. Et le tiroir de poils — incroyable.",av:"CD"},

            <div className="rev" key={i}>

            </div>

                <span>{it.q}</span>
                <span className="plus"><Ic.Plus/></span>
              </div>
              <div className="faq-a">{it.a}</div>
            </div>
          ))}
        </div>
      </div>
    </section>

    {/* Footer */}
    <footer className="footer">
      <div className="container">
        <div className="footer-grid">
          <div>
            <div className="brand"><span className="brand-mark"><Ic.Paw/></span>PILPOIL</div>
            <p className="footer-tag">La brosse vapeur qui rend les maisons douces et les animaux heureux. Conçue en Drôme, aimée partout.</p>
            <div className="foot-social">
              <a href="#"><Ic.Insta/></a>
              <a href="#"><Ic.Heart/></a>
            </div>
          </div>
          <div>
            <h5>Boutique</h5>
            <a href="#">La brosse vapeur</a>
            <a href="#">Accessoires</a>
            <a href="#">Cartes cadeaux</a>
          </div>
          <div>
            <h5>Aide</h5>
            <a href="#">Suivre ma commande</a>
            <a href="#">Livraison</a>
            <a href="#">Retours</a>
            <a href="#">Contact</a>
          </div>
          <div>
            <h5>La marque</h5>
            <a href="#">Notre atelier</a>
            <a href="#">Histoire</a>
            <a href="#">Vétérinaires</a>
          </div>
        </div>
        <div className="footer-bar">
          <span>© 2026 PILPOIL · Drôme, France</span>
          <span style={{display:"flex",gap:18}}>
            <a href="#" style={{padding:0}}>CGV</a>
            <a href="#" style={{padding:0}}>Mentions légales</a>
            <a href="#" style={{padding:0}}>Cookies</a>
          </span>
        </div>
      </div>
    </footer>

    {toast && (
      <div style={{position:"fixed",left:"50%",top:80,transform:"translateX(-50%)",zIndex:60,
        background:"var(--moss)",color:"var(--paper)",padding:"12px 20px",borderRadius:99,
        boxShadow:"var(--shadow)",fontWeight:600,fontSize:14,display:"flex",alignItems:"center",gap:8}}>
        <Ic.Check/> {toast}
      </div>
    )}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
