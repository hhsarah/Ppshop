<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PILPOIL — Lab. clinique pour le pelage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --white:#FBFCFC;
  --paper:#F2F5F6;
  --ice:#E7EEF1;
  --steel:#D4DEE2;
  --line:#C9D3D7;
  --ink:#0E1418;
  --ink-2:#384149;
  --mute:#6B7780;
  --glacier:#9EC9D9;
  --glacier-2:#C8DEE6;
  --chartreuse:#C9E84A;
  --chartreuse-2:#B5D633;
  --safety:#FF4B1F;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;background:var(--white);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.55}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:0}
.serif{font-family:'IBM Plex Serif',Georgia,serif;font-weight:500}
.container{max-width:1320px;margin:0 auto;padding:0 28px}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}

/* Top utility bar */
.utility{background:var(--ink);color:var(--white);font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.04em}
.utility-inner{display:flex;justify-content:space-between;align-items:center;padding:8px 28px;max-width:1320px;margin:0 auto}
.utility .pill{background:var(--chartreuse);color:var(--ink);padding:2px 8px;border-radius:2px;font-weight:600;margin-right:8px}
.utility .group{display:flex;gap:24px;align-items:center}
.utility .stat{display:flex;align-items:center;gap:8px}
.utility .blink{width:6px;height:6px;border-radius:50%;background:var(--chartreuse);animation:blk 1.6s infinite}
@keyframes blk{0%,100%{opacity:1}50%{opacity:.2}}

/* Nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(251,252,252,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--ink);text-decoration:none}
.brand-mono{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.04em;margin-top:2px;display:block}
.brand-mark{width:32px;height:32px;background:var(--ink);color:var(--chartreuse);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700}
.nav-links{display:flex;gap:28px}
.nav-links a{color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500;font-family:'IBM Plex Mono',monospace}
.nav-links a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.nav-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;color:var(--ink-2);border-radius:0}
.icon-btn:hover{background:var(--ink);color:var(--white);border-color:var(--ink)}
.cart-btn{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--chartreuse);border:0;padding:11px 16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.04em}
.cart-btn:hover{background:var(--chartreuse);color:var(--ink)}

/* Hero */
.hero{padding:48px 0 80px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:start}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr}}
.tag-mono{display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;
  background:var(--ice);color:var(--ink);padding:6px 12px;border:1px solid var(--line);font-weight:500;letter-spacing:.04em}
.tag-mono .dot{width:6px;height:6px;background:var(--chartreuse);border-radius:50%}
.hero h1{font-family:'IBM Plex Serif',serif;font-weight:500;font-size:clamp(54px,7.5vw,108px);line-height:.96;
  letter-spacing:-.02em;margin:18px 0 16px}
.hero h1 em{font-style:italic;color:var(--ink-2)}
.hero h1 mark{background:var(--chartreuse);padding:0 .15em;color:var(--ink)}
.hero p.sub{font-size:17px;color:var(--ink-2);max-width:52ch;margin:0 0 28px;line-height:1.55}

.specs-list{margin:28px 0 0;border-top:1px solid var(--line);padding-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}
.spec{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12.5px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.spec b{font-weight:600;color:var(--ink)}
.spec span{color:var(--mute)}

.cta-row{display:flex;gap:12px;margin-top:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;letter-spacing:.04em;padding:16px 22px;border-radius:0;transition:transform .15s,background .2s}
.btn-primary{background:var(--ink);color:var(--chartreuse)}
.btn-primary:hover{background:var(--chartreuse);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--white)}

/* Hero visual */
.hero-visual{position:relative;aspect-ratio:1.1/1;background:var(--ice);border:1px solid var(--line);overflow:hidden}
.hero-ph{position:absolute;inset:0;background:
  linear-gradient(180deg,#E2EDF1 0%,#CDDCE3 100%)}
.hero-ph::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 50% 60%,rgba(255,255,255,.6) 0%,transparent 50%)}

/* Grid overlay */
.grid-overlay{position:absolute;inset:0;background-image:
  linear-gradient(rgba(14,20,24,.06) 1px,transparent 1px),
  linear-gradient(90deg,rgba(14,20,24,.06) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none}
.crosshair{position:absolute;width:24px;height:24px;color:var(--ink);opacity:.7}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:currentColor}
.crosshair::before{left:50%;top:0;bottom:0;width:1px;transform:translateX(-.5px)}
.crosshair::after{top:50%;left:0;right:0;height:1px;transform:translateY(-.5px)}
.crosshair span{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:8px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--white);padding:3px 6px;white-space:nowrap;border:1px solid var(--line);letter-spacing:.04em}
.ch1{top:22%;left:30%}
.ch2{top:50%;left:60%}
.ch3{top:70%;left:38%}

.product-silhouette{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);width:36%;aspect-ratio:1/2;
  background:linear-gradient(170deg,#2C3540 0%,#0E1418 70%);
  box-shadow:inset 0 -10px 24px rgba(255,255,255,.04),0 30px 60px rgba(14,20,24,.25);
  border-radius:8% 8% 6% 6%}
.product-silhouette::after{content:"";position:absolute;top:8%;left:50%;transform:translateX(-50%);width:50%;height:4%;background:var(--chartreuse);border-radius:2px;box-shadow:0 0 16px var(--chartreuse)}

.callout{position:absolute;background:var(--white);border:1px solid var(--ink);padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;line-height:1.4}
.callout b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px;font-family:'IBM Plex Sans',sans-serif;font-weight:600}
.cal-1{top:8%;right:6%;max-width:200px}
.cal-2{bottom:10%;left:6%;max-width:200px}
.callout::before{content:"";position:absolute;background:var(--ink);width:1px;height:30px}
.cal-1::before{bottom:-30px;left:20px}
.cal-2::before{top:-30px;right:30px}

/* Trust bar */
.trust-bar{background:var(--ink);color:var(--white);padding:28px 0}
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-left:1px solid rgba(255,255,255,.1)}
@media(max-width:760px){.trust-grid{grid-template-columns:1fr 1fr}}
.trust-item{padding:6px 24px;border-right:1px solid rgba(255,255,255,.1)}
.trust-num{font-family:'IBM Plex Serif',serif;font-weight:500;font-size:42px;line-height:1;color:var(--chartreuse)}
.trust-lbl{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:rgba(255,255,255,.7);margin-top:6px;letter-spacing:.04em;text-transform:uppercase}

/* Section */
.section{padding:96px 0;border-bottom:1px solid var(--line)}
.section-head{margin-bottom:48px;display:grid;grid-template-columns:1fr 2fr;gap:48px;align-items:end}
@media(max-width:760px){.section-head{grid-template-columns:1fr}}
.section-head .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.section-head .eyebrow::before{content:"";width:24px;height:1px;background:var(--ink)}
.section-head h2{font-family:'IBM Plex Serif',serif;font-weight:500;font-size:clamp(40px,5vw,72px);line-height:1;letter-spacing:-.015em;margin:14px 0 0}
.section-head h2 em{font-style:italic;color:var(--ink-2)}

/* Schema / diagram */
.schema{background:var(--paper);padding:96px 0;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.schema-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;position:relative}
@media(max-width:980px){.schema-grid{grid-template-columns:1fr 1fr}}
.schema-card{background:var(--white);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:14px;min-height:240px}
.schema-card .num{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute);letter-spacing:.04em}
.schema-card .ico{width:64px;height:64px;background:var(--chartreuse);display:grid;place-items:center;color:var(--ink);margin-top:6px}
.schema-card h3{font-family:'IBM Plex Serif',serif;font-weight:500;font-size:22px;margin:auto 0 6px}
.schema-card p{margin:0;color:var(--ink-2);font-size:14px}
.schema-card.dark{background:var(--ink);color:var(--white)}
.schema-card.dark .num{color:var(--chartreuse)}
.schema-card.dark p{color:rgba(255,255,255,.7)}
.schema-card.dark .ico{background:var(--chartreuse)}

/* Data row */
.data-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:64px}
@media(max-width:760px){.data-row{grid-template-columns:1fr 1fr}}
.data-cell{padding:32px 24px;border-right:1px solid var(--line);position:relative}
.data-cell:last-child{border-right:0}
.data-cell .lbl{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between}
.data-cell .lbl small{font-weight:500;background:var(--ice);padding:2px 6px;color:var(--ink)}
.data-cell .val{font-family:'IBM Plex Serif',serif;font-weight:500;font-size:48px;line-height:1;margin-top:14px}
.data-cell .delta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--chartreuse-2);margin-top:10px;display:flex;align-items:center;gap:6px}
.data-cell .delta b{color:var(--ink);font-weight:600}

/* Compare table */
.compare{background:var(--white);padding:96px 0;border-bottom:1px solid var(--line)}
.cmp-table{width:100%;border-collapse:collapse;font-size:14px}
.cmp-table thead th{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmp-table thead th.us{background:var(--ink);color:var(--chartreuse)}
.cmp-table td{padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
.cmp-table td:first-child{font-weight:500;color:var(--ink-2)}
.cmp-table td.us{background:rgba(201,232,74,.12);border-left:2px solid var(--chartreuse)}
.cmp-table td .yes{color:var(--ink);display:inline-flex;align-items:center;gap:8px;font-weight:600}
.cmp-table td .no{color:var(--mute);display:inline-flex;align-items:center;gap:8px}
.cmp-table td.us .yes svg{color:var(--chartreuse-2)}

/* Product */
.product{padding:96px 0;border-bottom:1px solid var(--line)}
.p-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:start}
@media(max-width:980px){.p-grid{grid-template-columns:1fr}}
.p-frame{position:relative;aspect-ratio:1;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.p-frame .obj{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38%;aspect-ratio:1/2;
  background:linear-gradient(170deg,#2C3540 0%,#0E1418 70%);
  border-radius:8% 8% 6% 6%;
  box-shadow:inset 0 -10px 24px rgba(255,255,255,.04),0 30px 60px rgba(14,20,24,.2)}
.p-frame .obj::after{content:"";position:absolute;top:8%;left:50%;transform:translateX(-50%);width:50%;height:4%;background:var(--chartreuse);border-radius:2px;box-shadow:0 0 16px var(--chartreuse)}
.p-frame .tag-pos{position:absolute;top:18px;left:18px}
.p-frame .ruler{position:absolute;right:18px;top:18px;bottom:18px;width:24px;display:flex;flex-direction:column;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--mute);text-align:right}
.p-frame .ruler span{padding-right:4px;border-right:1px solid var(--line)}
.p-thumbs{display:flex;gap:8px;margin-top:8px}
.p-thumb{flex:1;aspect-ratio:1;background:var(--paper);border:1px solid var(--line);cursor:pointer}
.p-thumb.active{border-color:var(--ink);outline:2px solid var(--chartreuse)}

.p-info .sku{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute);letter-spacing:.04em}
.p-info h2{font-family:'IBM Plex Serif',serif;font-weight:500;font-size:clamp(40px,5vw,68px);line-height:1;margin:10px 0 4px}
.p-rating{display:flex;align-items:center;gap:12px;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--mute)}
.stars{display:flex;color:var(--ink);gap:1px}
.p-rating .ok{color:var(--chartreuse-2);font-weight:600}
.price-block{display:flex;align-items:baseline;gap:14px;margin:24px 0 14px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.price{font-family:'IBM Plex Serif',serif;font-weight:500;font-size:48px;line-height:1}
.price-old{color:var(--mute);text-decoration:line-through;font-size:18px}
.price-save{background:var(--chartreuse);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:5px 10px;letter-spacing:.04em}

.swatches{display:flex;gap:8px;margin:14px 0 18px}
.sw{width:44px;height:44px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer}
.sw.active{outline:2px solid var(--chartreuse);outline-offset:-2px}
.sw .col{width:24px;height:24px}
.sw.charcoal .col{background:linear-gradient(135deg,#2C3540,#0E1418)}
.sw.ice .col{background:linear-gradient(135deg,var(--glacier-2),var(--glacier))}
.sw.lime .col{background:linear-gradient(135deg,var(--chartreuse),var(--chartreuse-2))}

.qty{display:inline-flex;align-items:center;border:1px solid var(--ink)}
.qty button{width:38px;height:38px;border:0;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:18px}
.qty button:hover{background:var(--ink);color:var(--chartreuse)}
.qty .n{min-width:36px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600}
.add-row{display:flex;gap:8px;margin-top:18px}
.add-row .btn-primary{flex:1;padding:18px 22px;font-size:14px;justify-content:space-between}

.assurance{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.assurance li{list-style:none;display:flex;gap:12px;align-items:center;font-size:13.5px;color:var(--ink-2);font-family:'IBM Plex Mono',monospace}
.assurance svg{color:var(--chartreuse-2);flex:none}

/* Reviews */
.reviews{padding:96px 0;border-bottom:1px solid var(--line);background:var(--paper)}
.revs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:880px){.revs-grid{grid-template-columns:1fr}}
.rev{background:var(--white);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:14px}
.rev-hd{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)}
.rev-hd .id{background:var(--ice);padding:2px 8px}
.rev p{margin:0;font-family:'IBM Plex Serif',serif;font-size:18px;line-height:1.4;color:var(--ink)}
.rev-foot{margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px}
.rev-foot b{font-weight:600;color:var(--ink)}
.rev-foot small{color:var(--mute);font-family:'IBM Plex Mono',monospace;font-size:11.5px}
.rev-pic{aspect-ratio:16/9;background:var(--ice);position:relative;overflow:hidden;margin:-24px -24px 0}
.rev-pic::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(158,201,217,.3) 0 12px,transparent 12px 24px)}

/* FAQ */
.faq{padding:96px 0;border-bottom:1px solid var(--line)}
.faq-list{display:grid;grid-template-columns:1fr;gap:0;max-width:880px;margin:0 auto;border-top:1px solid var(--line)}
.faq-item{border-bottom:1px solid var(--line)}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:24px 0;cursor:pointer;font-weight:500;font-size:18px;font-family:'IBM Plex Serif',serif}
.faq-q .plus{width:30px;height:30px;background:var(--ice);display:grid;place-items:center;transition:all .25s;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500}
.faq-item.open .plus{background:var(--chartreuse);transform:rotate(45deg)}
.faq-q .qid{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);letter-spacing:.04em;margin-right:18px}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s,padding .25s;color:var(--ink-2);font-size:15px}
.faq-item.open .faq-a{padding:0 0 24px;max-height:400px}

/* Footer */
.footer{background:var(--ink);color:var(--white);padding:72px 0 24px}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px;margin-bottom:48px}
@media(max-width:840px){.footer-grid{grid-template-columns:1fr 1fr;gap:36px 24px}}
.footer h5{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--chartreuse);margin:0 0 18px;font-weight:600}
.footer a{color:var(--white);text-decoration:none;display:block;padding:5px 0;font-size:13.5px;opacity:.8;font-family:'IBM Plex Mono',monospace}
.footer a:hover{opacity:1;color:var(--chartreuse)}
.footer .brand{color:var(--white)}
.footer .brand-mark{background:var(--chartreuse);color:var(--ink)}
.footer-tag{margin-top:14px;color:rgba(255,255,255,.65);max-width:30ch;font-size:13.5px;line-height:1.6;font-family:'IBM Plex Mono',monospace}
.footer-bar{padding-top:24px;border-top:1px solid rgba(255,255,255,.12);font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,.55);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;letter-spacing:.04em;text-transform:uppercase}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useRef } = React;
