<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PILPOIL — Pastel pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=General+Sans:wght@500;600;700&family=Sniglet:wght@400;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --cream:#FFF8EE;
  --rose:#FBD5D2;
  --rose-2:#F4ACAE;
  --pistache:#CDE3B2;
  --pistache-2:#A9CC85;
  --sky:#C8E4EB;
  --corail:#FF7A6B;
  --lilac:#E5D5F2;
  --honey:#FFD66E;
  --ink:#241A1A;
  --ink-2:#4A3D3D;
  --mute:#8C7B7B;
  --line:rgba(36,26,26,.10);
  --shadow:0 2px 4px rgba(36,26,26,.04),0 20px 50px rgba(36,26,26,.10);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'General Sans',ui-sans-serif,system-ui,sans-serif;background:var(--cream);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.55;font-weight:500;
  background-image:radial-gradient(circle at 10% 10%,rgba(251,213,210,.4) 0,transparent 40%),
                  radial-gradient(circle at 90% 80%,rgba(205,227,178,.4) 0,transparent 40%)}
.chunky{font-family:'Sniglet',cursive;font-weight:800;letter-spacing:-.02em;line-height:.95}
.container{max-width:1240px;margin:0 auto;padding:0 24px}
button{font-family:inherit;cursor:pointer}
img{display:block;max-width:100%}

/* BUNDLE BAR at very top */
.bundle-bar{background:var(--ink);color:var(--cream);position:relative;overflow:hidden}
.bundle-bar::before,.bundle-bar::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;filter:blur(50px);opacity:.6}
.bundle-bar::before{background:var(--corail);top:-60px;left:10%}
.bundle-bar::after{background:var(--pistache-2);bottom:-60px;right:10%}
.bundle-inner{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center;padding:18px 0}
@media(max-width:760px){.bundle-inner{grid-template-columns:1fr;text-align:center}}
.bundle-tag{display:inline-flex;align-items:center;gap:8px;background:var(--corail);color:var(--cream);
  padding:6px 12px;border-radius:99px;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.bundle-tag .pulse{width:8px;height:8px;border-radius:50%;background:var(--cream);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.bundle-headline{font-family:'Sniglet',cursive;font-weight:800;font-size:18px;line-height:1.1}
.bundle-headline em{color:var(--honey);font-style:normal}
.bundle-headline small{display:block;font-family:'General Sans',sans-serif;font-weight:500;font-size:12.5px;color:rgba(255,248,238,.7);margin-top:4px;letter-spacing:.02em}
.bundle-cta{display:inline-flex;align-items:center;gap:10px;background:var(--honey);color:var(--ink);
  padding:14px 22px;border-radius:99px;font-weight:700;font-size:14px;border:0;transition:transform .15s}
.bundle-cta:hover{transform:translateY(-2px) rotate(-1deg)}
.bundle-timer{display:flex;gap:6px;align-items:center;font-family:'Sniglet',cursive;font-weight:800;font-size:16px}
.bundle-timer .t{background:rgba(255,255,255,.15);padding:6px 10px;border-radius:8px;min-width:36px;text-align:center}

/* Nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,248,238,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Sniglet',cursive;font-weight:800;font-size:22px;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.brand-mark{width:38px;height:38px;background:var(--corail);color:var(--cream);display:grid;place-items:center;border-radius:50%;transform:rotate(-6deg);transition:transform .2s}
.brand:hover .brand-mark{transform:rotate(6deg)}
.nav-links{display:flex;gap:6px}
.nav-links a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;padding:8px 14px;border-radius:99px;transition:background .2s}
.nav-links a:hover{background:var(--rose)}
.nav-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--rose);border:0;display:grid;place-items:center;color:var(--ink);transition:transform .15s,background .2s}
.icon-btn:hover{background:var(--corail);color:var(--cream);transform:rotate(-6deg)}
.cart-btn{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--cream);border:0;padding:10px 18px 10px 14px;border-radius:99px;font-weight:700;font-size:14px;transition:transform .15s}
.cart-btn:hover{transform:translateY(-2px)}
.cart-btn .badge{background:var(--honey);color:var(--ink);padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}

/* Hero */
.hero{padding:48px 0 90px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--pistache);color:var(--ink);
  padding:8px 14px;border-radius:99px;font-weight:700;font-size:13px}
.pill .star{color:var(--corail)}
.hero h1{font-family:'Sniglet',cursive;font-weight:800;font-size:clamp(56px,8.5vw,128px);line-height:.92;margin:18px 0 18px;letter-spacing:-.025em}
.hero h1 span.pop{background:var(--honey);padding:0 .12em;border-radius:14px;display:inline-block;transform:rotate(-2deg)}
.hero h1 span.wiggle{color:var(--corail);display:inline-block;animation:wiggle 4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.hero p.sub{font-size:18px;color:var(--ink-2);max-width:46ch;margin:0 0 28px;font-weight:500}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;font-weight:700;font-size:15px;padding:16px 26px;border-radius:99px;transition:transform .18s,box-shadow .2s}
.btn-primary{background:var(--corail);color:var(--cream);box-shadow:0 6px 0 var(--ink)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:14px 24px}
.btn-ghost:hover{background:var(--ink);color:var(--cream)}
.stars-row{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13.5px;color:var(--ink-2)}
.stars{display:flex;color:var(--corail);gap:1px}

/* Hero visual collage */
.hero-collage{position:relative;aspect-ratio:1/1.05;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:14px}
.cell{border-radius:24px;overflow:hidden;position:relative;box-shadow:var(--shadow);display:grid;place-items:center;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--ink-2);text-align:center;padding:6px}
.cell.c1{grid-column:1/4;grid-row:1/4;background:var(--rose);background-image:radial-gradient(circle at 30% 30%,#FCE2DF,var(--rose))}
.cell.c2{grid-column:4/7;grid-row:1/3;background:var(--pistache);background-image:radial-gradient(circle at 70% 30%,#DDEBC8,var(--pistache))}
.cell.c3{grid-column:4/7;grid-row:3/5;background:var(--lilac);background-image:radial-gradient(circle at 50% 50%,#EFE2F8,var(--lilac))}
.cell.c4{grid-column:1/3;grid-row:4/7;background:var(--sky);background-image:radial-gradient(circle at 30% 70%,#DCEEF3,var(--sky))}
.cell.c5{grid-column:3/5;grid-row:5/7;background:var(--honey);background-image:radial-gradient(circle at 50% 50%,#FFE39A,var(--honey))}
.cell.c6{grid-column:5/7;grid-row:5/7;background:var(--corail);color:var(--cream);background-image:radial-gradient(circle at 50% 30%,#FF9A8C,var(--corail))}
.cell.brand-tile{font-family:'Sniglet',cursive;font-weight:800;font-size:32px;color:var(--ink)}
.cell.brand-tile small{display:block;font-family:'General Sans',sans-serif;font-weight:600;font-size:10.5px;margin-top:4px;letter-spacing:.04em;opacity:.6}
.cell.product .obj{width:38%;aspect-ratio:1/2;border-radius:50% 50% 38% 38% / 60% 60% 40% 40%;background:linear-gradient(170deg,#3A2E2E 0%,#1A1010 70%);box-shadow:inset 0 -10px 24px rgba(255,255,255,.08),0 20px 40px rgba(36,26,26,.3)}
.float-emoji{position:absolute;font-size:36px;pointer-events:none;animation:float 4s ease-in-out infinite}
.float-emoji.f1{top:-12px;left:18%;animation-delay:-1s}
.float-emoji.f2{bottom:8%;right:-12px;animation-delay:-2s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(8deg)}}

/* Trust row */
.trust{margin-top:50px;padding-top:32px;border-top:2px dashed var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:760px){.trust{grid-template-columns:repeat(2,1fr)}}
.trust-item{display:flex;gap:12px;align-items:center;font-size:14px}
.trust-item .b{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.trust-item:nth-child(1) .b{background:var(--rose);color:var(--corail)}
.trust-item:nth-child(2) .b{background:var(--pistache);color:var(--pistache-2)}
.trust-item:nth-child(3) .b{background:var(--lilac);color:var(--ink)}
.trust-item:nth-child(4) .b{background:var(--honey);color:var(--ink)}
.trust-item b{display:block;font-weight:700}
.trust-item small{display:block;color:var(--mute);font-size:12.5px}

/* Section common */
.section{padding:96px 0;position:relative}
.section-head{max-width:680px;margin:0 auto 56px;text-align:center}
.section-head h2{font-family:'Sniglet',cursive;font-weight:800;font-size:clamp(40px,5.5vw,84px);line-height:1;margin:14px 0 12px;letter-spacing:-.02em}
.section-head h2 .pop{background:var(--rose);padding:0 .12em;border-radius:14px;display:inline-block;transform:rotate(-1deg)}
.section-head p{font-size:17px;color:var(--ink-2);max-width:42ch;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--lilac);color:var(--ink);padding:6px 14px;border-radius:99px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* Steps */
.steps-wrap{background:var(--rose);padding:96px 0;border-radius:60px;margin:0 24px;position:relative;overflow:hidden}
@media(max-width:760px){.steps-wrap{margin:0 12px;border-radius:36px}}
.steps-wrap::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:var(--corail);opacity:.15;top:-100px;right:-100px;filter:blur(20px)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;position:relative}
@media(max-width:880px){.steps{grid-template-columns:1fr}}
.step{background:var(--cream);border-radius:28px;padding:32px;transition:transform .25s ease;position:relative}
.step:hover{transform:translateY(-6px) rotate(-1deg)}
.step .num{font-family:'Sniglet',cursive;font-weight:800;font-size:80px;line-height:.8;color:var(--corail);margin-bottom:10px}
.step h3{font-family:'Sniglet',cursive;font-weight:800;font-size:24px;margin:0 0 8px}
.step p{margin:0;color:var(--ink-2);font-size:15px}
.step .ico-art{width:84px;height:84px;border-radius:50%;background:var(--pistache);display:grid;place-items:center;color:var(--ink);margin-bottom:18px}
.step:nth-child(2) .ico-art{background:var(--lilac)}
.step:nth-child(3) .ico-art{background:var(--honey)}

/* Benefits */
.bens{padding:96px 0}
.bens-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:980px){.bens-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.bens-grid{grid-template-columns:1fr}}
.ben{border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:14px;min-height:200px;transition:transform .25s}
.ben:hover{transform:translateY(-4px) rotate(1deg)}
.ben h4{margin:auto 0 0;font-family:'Sniglet',cursive;font-weight:800;font-size:20px;line-height:1.15}
.ben .ico{width:46px;height:46px;border-radius:50%;background:rgba(36,26,26,.1);display:grid;place-items:center}
.ben.rose{background:var(--rose)}
.ben.pistache{background:var(--pistache)}
.ben.sky{background:var(--sky)}
.ben.lilac{background:var(--lilac)}
.ben.honey{background:var(--honey)}
.ben.corail{background:var(--corail);color:var(--cream)}
.ben.corail .ico{background:rgba(255,248,238,.2);color:var(--cream)}
.ben.dark{background:var(--ink);color:var(--cream)}
.ben.dark .ico{background:rgba(255,248,238,.15);color:var(--cream)}

/* Product */
.product{background:var(--cream);padding:96px 0;position:relative}
.p-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:start}
@media(max-width:980px){.p-grid{grid-template-columns:1fr}}
.p-main{aspect-ratio:1;border-radius:40px;background:linear-gradient(150deg,var(--rose) 0%,var(--lilac) 100%);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.p-main .obj{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:38%;aspect-ratio:1/2;
  background:linear-gradient(170deg,#3A2E2E 0%,#1A1010 70%);
  border-radius:50% 50% 38% 38% / 60% 60% 40% 40%;
  box-shadow:inset 0 -10px 24px rgba(255,255,255,.08),0 30px 60px rgba(36,26,26,.25)}
.p-main .blob{position:absolute;width:140px;height:140px;border-radius:50%;filter:blur(40px);opacity:.6}
.p-main .blob.b1{background:var(--honey);top:8%;left:8%}
.p-main .blob.b2{background:var(--corail);bottom:8%;right:8%}
.tag-pos{position:absolute;top:18px;left:18px;display:inline-flex;align-items:center;gap:8px;background:var(--cream);padding:8px 14px;border-radius:99px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.p-thumbs{display:flex;gap:10px;margin-top:14px}
.p-thumb{flex:1;aspect-ratio:1;border-radius:18px;border:3px solid transparent;cursor:pointer;transition:transform .15s}
.p-thumb:hover{transform:translateY(-2px)}
.p-thumb.active{border-color:var(--ink)}
.p-thumb.t1{background:linear-gradient(135deg,var(--rose),var(--lilac))}
.p-thumb.t2{background:linear-gradient(135deg,var(--pistache),var(--sky))}
.p-thumb.t3{background:linear-gradient(135deg,var(--honey),var(--corail))}
.p-thumb.t4{background:linear-gradient(135deg,var(--cream),var(--rose))}

.p-info h2{font-family:'Sniglet',cursive;font-weight:800;font-size:clamp(40px,5vw,68px);line-height:1;margin:8px 0 4px;letter-spacing:-.02em}
.p-info h2 .pop{background:var(--pistache);padding:0 .12em;border-radius:14px;display:inline-block;transform:rotate(-1deg)}
.p-meta{display:flex;align-items:center;gap:10px;margin:12px 0 18px;font-size:14px;color:var(--ink-2)}
.price{font-family:'Sniglet',cursive;font-weight:800;font-size:48px;line-height:1}
.price-old{color:var(--mute);text-decoration:line-through;font-size:18px;margin-left:12px;font-weight:600}
.price-save{background:var(--corail);color:var(--cream);font-size:11px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:99px;margin-left:10px;text-transform:uppercase}

.swatches{display:flex;gap:10px;margin:10px 0 0}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.sw:hover{transform:scale(1.05)}
.sw.active{border-color:var(--ink)}
.sw.rose{background:linear-gradient(135deg,#FDE5E2,var(--rose-2))}
.sw.pistache{background:linear-gradient(135deg,#D9EBC2,var(--pistache-2))}
.sw.charcoal{background:linear-gradient(135deg,#3A2E2E,#1A1010)}

.qty{display:inline-flex;align-items:center;background:var(--rose);border-radius:99px;padding:6px;margin-top:6px}
.qty button{width:36px;height:36px;border:0;background:transparent;border-radius:50%;font-size:18px;font-weight:700;cursor:pointer}
.qty button:hover{background:var(--cream)}
.qty .n{min-width:34px;text-align:center;font-weight:700}
.add-row{display:flex;gap:10px;margin-top:24px}
.add-row .btn-primary{flex:1;padding:18px 22px;font-size:16px;justify-content:center}

.assurance{margin-top:28px;padding-top:24px;border-top:2px dashed var(--line);display:flex;flex-direction:column;gap:12px}
.assurance li{list-style:none;display:flex;gap:12px;align-items:center;font-size:14px;color:var(--ink-2);font-weight:500}
.assurance svg{color:var(--corail);flex:none}

/* Marquee */
.marquee{background:var(--ink);color:var(--cream);padding:18px 0;overflow:hidden;font-family:'Sniglet',cursive;font-weight:800;font-size:28px;border-radius:36px;margin:0 24px}
@media(max-width:760px){.marquee{margin:0 12px;font-size:22px}}
.marquee-track{display:flex;gap:42px;animation:marq 30s linear infinite;white-space:nowrap}
.marquee-track span{display:inline-flex;align-items:center;gap:18px}
.marquee-track .dot{width:14px;height:14px;background:var(--corail);border-radius:50%;display:inline-block}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Reviews */
.revs-wrap{padding:96px 0}
.revs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:880px){.revs-grid{grid-template-columns:1fr}}
.rev{background:var(--cream);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px;transition:transform .2s}
.rev:nth-child(1){background:var(--rose)}
.rev:nth-child(2){background:var(--pistache)}
.rev:nth-child(3){background:var(--lilac)}
.rev:hover{transform:translateY(-3px) rotate(-.5deg)}
.rev-img{aspect-ratio:4/3;border-radius:18px;background:var(--cream);position:relative;overflow:hidden}
.rev-img::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(36,26,26,.06) 0 12px,transparent 12px 22px)}
.rev-stars{display:flex;color:var(--corail);gap:1px}
.rev p{margin:0;font-family:'Sniglet',cursive;font-weight:800;font-size:17px;line-height:1.35;color:var(--ink)}
.rev-name{display:flex;gap:12px;align-items:center;margin-top:auto;padding-top:14px;border-top:2px dashed rgba(36,26,26,.15)}
.rev-name .av{width:42px;height:42px;border-radius:50%;background:var(--corail);color:var(--cream);display:grid;place-items:center;font-family:'Sniglet',cursive;font-weight:800;font-size:14px}
.rev-name b{display:block;font-weight:700;font-size:14px}
.rev-name small{color:var(--ink-2);font-size:12.5px;opacity:.7}

/* FAQ */
.faq{padding:96px 0;background:var(--cream)}
.faq-list{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.faq-item{background:var(--rose);border-radius:24px;overflow:hidden;transition:background .2s}
.faq-item:nth-child(2n){background:var(--pistache)}
.faq-item:nth-child(3n){background:var(--lilac)}
.faq-item:nth-child(4n){background:var(--sky)}
.faq-item:nth-child(5n){background:var(--honey)}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;cursor:pointer;font-family:'Sniglet',cursive;font-weight:800;font-size:18px}
.faq-q .plus{width:32px;height:32px;border-radius:50%;background:var(--cream);display:grid;place-items:center;transition:transform .25s;font-size:18px;font-weight:800}
.faq-item.open .plus{transform:rotate(45deg);background:var(--ink);color:var(--cream)}
.faq-a{padding:0 24px;max-height:0;overflow:hidden;transition:max-height .35s,padding .25s;color:var(--ink-2);font-size:15px;font-weight:500}
.faq-item.open .faq-a{padding:0 24px 24px;max-height:400px}

/* Footer */
.footer{background:var(--ink);color:var(--cream);padding:80px 0 28px;border-top-left-radius:48px;border-top-right-radius:48px;margin-top:60px;position:relative;overflow:hidden}
.footer::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:var(--corail);opacity:.2;filter:blur(60px);top:-100px;right:-50px}
.footer::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:var(--pistache-2);opacity:.18;filter:blur(60px);bottom:-80px;left:10%}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;margin-bottom:48px;position:relative}
@media(max-width:840px){.footer-grid{grid-template-columns:1fr 1fr;gap:36px 24px}}
.footer h5{font-family:'Sniglet',cursive;font-weight:800;font-size:14px;letter-spacing:.02em;color:var(--honey);margin:0 0 16px;text-transform:none}
.footer a{color:var(--cream);text-decoration:none;display:block;padding:6px 0;font-size:14px;opacity:.85}
.footer a:hover{opacity:1;color:var(--honey)}

// Countdown to midnight
function useCountdown(){
  const [t,setT]=useState({h:"--",m:"--",s:"--"});
  useEffect(()=>{
    const tick=()=>{
      const now=new Date();
      const end=new Date(now);end.setHours(23,59,59,999);
      const ms=end-now;
      const h=Math.floor(ms/3600000);
      const m=Math.floor(ms%3600000/60000);
      const s=Math.floor(ms%60000/1000);
      setT({h:String(h).padStart(2,"0"),m:String(m).padStart(2,"0"),s:String(s).padStart(2,"0")});
    };
    tick();const i=setInterval(tick,1000);return ()=>clearInterval(i);
  },[]);
  return t;
}
